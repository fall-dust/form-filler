<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>嵌入子表单</title>
</head>
<body>
  <form id="child-form">
    <div style="margin: 8px 0">
      <label for="child-name">公司名称？</label>
      <input type="text" id="child-name" name="company" />
    </div>
    <div style="margin: 8px 0">
      <label for="child-dept">所属部门？</label>
      <input type="text" id="child-dept" name="dept" />
    </div>
  </form>
</body>
</html>
